spring:
  application:
    name: event-alerting-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventalert}
    username: ${DB_USER:eventalert}
    password: ${DB_PASSWORD:eventalert}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Defaults target MailHog (docker-compose service `mailhog`, or localhost:1025 when
  # run from IntelliJ) — a fake SMTP server with a web UI, no real provider needed to
  # test email delivery end to end. Override for a real provider via env vars.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

security:
  jwt:
    # Dev-only default (>=32 bytes for HS256) — override via JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-CHANGE-ME-in-production-please-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  notifications:
    email:
      from: ${EMAIL_FROM:alerts@eventalert.local}
  # DISASTER (USGS) needs no key and works out of the box. NEWS and MARKET stay
  # idle (fetchLatest returns nothing) until their API key env vars are set.
  ingestion:
    poll-interval-ms: ${INGESTION_POLL_INTERVAL_MS:120000}
    newsapi:
      key: ${NEWSAPI_KEY:}
    finnhub:
      key: ${FINNHUB_KEY:}
      symbols: ${FINNHUB_SYMBOLS:AAPL,MSFT,GOOGL,AMZN,TSLA}
  # In-memory, per-instance rate limiting (RateLimitingFilter) — resets on restart,
  # not shared across instances. Fine for one instance; revisit before scaling out.
  rate-limit:
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    auth-limit: ${RATE_LIMIT_AUTH:10}
    default-limit: ${RATE_LIMIT_DEFAULT:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080
