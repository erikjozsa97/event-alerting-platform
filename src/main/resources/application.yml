spring:
  application:
    name: event-alerting-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventalert}
    username: ${DB_USER:eventalert}
    password: ${DB_PASSWORD:eventalert}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    # Dev-only default (>=32 bytes for HS256) — override via JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-CHANGE-ME-in-production-please-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080
