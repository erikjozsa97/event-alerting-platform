services:
  postgres:
    image: postgres:16-alpine
    container_name: eventalert-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-eventalert}
      POSTGRES_USER: ${DB_USER:-eventalert}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventalert}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventalert}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: eventalert-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — view every email the app sends

  app:
    build: .
    container_name: eventalert-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eventalert}
      DB_USER: ${DB_USER:-eventalert}
      DB_PASSWORD: ${DB_PASSWORD:-eventalert}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      # Optional — DISASTER (USGS) ingestion works with none of these set.
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      FINNHUB_KEY: ${FINNHUB_KEY:-}
      FINNHUB_SYMBOLS: ${FINNHUB_SYMBOLS:-AAPL,MSFT,GOOGL,AMZN,TSLA}
      INGESTION_POLL_INTERVAL_MS: ${INGESTION_POLL_INTERVAL_MS:-120000}
    ports:
      - "8080:8080"

volumes:
  pgdata:
